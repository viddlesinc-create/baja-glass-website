[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# IMPORTANT: Disable Netlify's built-in "Prerendering" under
# Site Settings > Build & Deploy > Post Processing > Prerendering.
# Our build generates static HTML per route; the plugin conflicts with that.
#
# ==========================================
# PATH-BASED 301 REDIRECTS (before SPA catch-all)
# ==========================================

# Legacy WordPress page redirects via query params
[[redirects]]
  from = "/*"
  to = "/about"
  status = 301
  force = false
  [redirects.query]
    page_id = "32"

[[redirects]]
  from = "/*"
  to = "/contact"
  status = 301
  force = false
  [redirects.query]
    page_id = "85"

# Clean up spam/tracking query parameters - redirect to same path without params
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    kuid = ":kuid"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    yandex-source = ":yandex"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    ga_action = ":ga"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    s = ":s"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    kref = ":kref"

# Cannibalization fix: consolidate into main hub
[[redirects]]
  from = "/custom-shower-doors-las-vegas"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

[[redirects]]
  from = "/shower-doors-las-vegas/repair"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

# Legacy WordPress path redirects
[[redirects]]
  from = "/services/*"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us/*"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
  force = true

# Trailing slash cleanup
[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301
  force = false

[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301
  force = false

[[redirects]]
  from = "/gallery/"
  to = "/gallery"
  status = 301
  force = false

[[redirects]]
  from = "/resources/"
  to = "/resources"
  status = 301
  force = false

[[redirects]]
  from = "/areas-served/"
  to = "/areas-served"
  status = 301
  force = false

[[redirects]]
  from = "/shower-doors-las-vegas/"
  to = "/shower-doors-las-vegas"
  status = 301
  force = false

[[redirects]]
  from = "/glass-company-las-vegas/"
  to = "/glass-company-las-vegas"
  status = 301
  force = false

# Semi-frameless URL variation
[[redirects]]
  from = "/shower-doors-las-vegas/semi-frameless"
  to = "/shower-doors-las-vegas/semi-frameless-framed"
  status = 301
  force = true

# Repair URL retired — no repair services offered (renamed to replacement, Jul 2026)
[[redirects]]
  from = "/glass-company-las-vegas/residential-glass-repair"
  to = "/glass-company-las-vegas/residential-glass-replacement"
  status = 301
  force = true


