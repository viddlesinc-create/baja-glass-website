[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# IMPORTANT: Disable Netlify's built-in "Prerendering" under
# Site Settings > Build & Deploy > Post Processing > Prerendering.
# Our build generates static HTML per route; the plugin conflicts with that.
#
# ==========================================
# PATH-BASED 301 REDIRECTS (before SPA catch-all)
# ==========================================

# Legacy WordPress page redirects via query params
[[redirects]]
  from = "/*"
  to = "/about"
  status = 301
  force = false
  [redirects.query]
    page_id = "32"

[[redirects]]
  from = "/*"
  to = "/contact"
  status = 301
  force = false
  [redirects.query]
    page_id = "85"

# Clean up spam/tracking query parameters - redirect to same path without params
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    kuid = ":kuid"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    yandex-source = ":yandex"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    ga_action = ":ga"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    s = ":s"

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 301
  force = false
  [redirects.query]
    kref = ":kref"

# Cannibalization fix: consolidate into main hub
[[redirects]]
  from = "/custom-shower-doors-las-vegas"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

# Replacement URL consolidation
[[redirects]]
  from = "/shower-door-replacement-las-vegas"
  to = "/shower-door-installation-las-vegas"
  status = 301
  force = true

[[redirects]]
  from = "/shower-doors-las-vegas/repair"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

# Legacy WordPress path redirects
[[redirects]]
  from = "/services/*"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/shower-doors-las-vegas"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us/*"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
  force = true

# Trailing slash cleanup
[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301
  force = false

[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301
  force = false

[[redirects]]
  from = "/gallery/"
  to = "/gallery"
  status = 301
  force = false

[[redirects]]
  from = "/resources/"
  to = "/resources"
  status = 301
  force = false

[[redirects]]
  from = "/areas-served/"
  to = "/areas-served"
  status = 301
  force = false

[[redirects]]
  from = "/shower-doors-las-vegas/"
  to = "/shower-doors-las-vegas"
  status = 301
  force = false

[[redirects]]
  from = "/glass-company-las-vegas/"
  to = "/glass-company-las-vegas"
  status = 301
  force = false

# Semi-frameless URL variation
[[redirects]]
  from = "/shower-doors-las-vegas/semi-frameless"
  to = "/shower-doors-las-vegas/semi-frameless-framed"
  status = 301
  force = true

# ==========================================
# WWW → NON-WWW (consolidate link equity)
# ==========================================

[[redirects]]
  from = "https://www.bajaglass.com/*"
  to = "https://bajaglass.com/:splat"
  status = 301
  force = true

# ==========================================
# SPA CATCH-ALL (must be LAST)
# ==========================================



[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

# ==========================================
# HEADERS
# ==========================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
